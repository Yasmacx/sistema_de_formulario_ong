<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ONG</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>
<body>

    <!-- NAV / HEADER (Comum a todas as abas) -->
    <header class="main-header">
        <div class="logo">
            <a href="../index.html"><img src="../assets/images/logo.svg" alt="Logo ONG"></a>
        </div>
        <nav class="nav-links">
            <a href="sobre.html">Sobre Nós</a>
            <a href="programas.html">Programas</a>
            <a href="como-ajudar.html">Como ajudar</a>
            <a href="transparencia.html">Transparência</a>
            <a href="contato.html" class="active">Contato</a>
        </nav>
        <a href="como-ajudar.html" class="btn-apoie">Apoie</a>
    </header>

    <!-- CONTEÚDO PRINCIPAL: FORMULÁRIO DE CONTATO -->
    <main class="contato-container">
        <section class="form-section">
            <div class="form-card">
                <h2>Fale Conosco</h2>
                <p>Preencha o formulário abaixo para entrar em contato com a nossa equipe.</p>

                <form action="#" method="POST" class="contact-form">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                    </div>

                    <div class="input-group">
                        <label for="assunto">Assunto</label>
                        <select id="assunto" name="assunto" required>
                            <option value="" disabled selected>Selecione um assunto</option>
                            <option value="duvidas">Dúvidas gerais</option>
                            <option value="voluntariado">Seja um voluntário</option>
                            <option value="doacao">Doações e Parcerias</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensagem</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
